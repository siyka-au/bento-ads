# Reads the AdsGo_Testing PLC project (siyka/ads-go/plc/testing), whose
# outputs are all derived from Main.fbTypeTest.nSeed.
#   bento-ads -e .env -c example/testing-plc.yaml
input:
  ads:
    targetIP: ${ADS_TARGET_IP:127.0.0.1}
    targetAMS: ${ADS_TARGET_NET_ID:127.0.0.1.1.1}
    runtimePort: ${ADS_TARGET_PORT:851}
    localMode: ${ADS_LOCAL_MODE:false}
    readType: 'interval'
    intervalTime: 1000
    symbols:
      - 'Main.fbTypeTest.nSeed'
      - 'Main.fbTypeTest.bBoolVar'
      - 'Main.fbTypeTest.nIntVar'
      - 'Main.fbTypeTest.fLrealVar'
      - 'Main.fbTypeTest.tTimeVar'
      - 'Main.fbTypeTest.sStringVar'

pipeline:
  processors:
    - mapping: |
        root.symbol = meta("symbol_name")
        root.value = content().string()
        root.data_type = meta("data_type")

output:
  stdout: {}
