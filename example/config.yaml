# Connection settings come from the environment, e.g. a .env file:
#   bento-ads -e .env -c example/config.yaml
input:
  ads:
    targetIP: ${ADS_TARGET_IP:192.168.1.100}
    targetAMS: ${ADS_TARGET_NET_ID:192.168.1.100.1.1}
    runtimePort: ${ADS_TARGET_PORT:851}  # 851 for TwinCAT 3, 801 for TwinCAT 2
    localMode: ${ADS_LOCAL_MODE:false}
    hostAMS: 'auto'
    readType: 'notification'  # or 'interval'
    maxDelay: 100
    cycleTime: 100
    intervalTime: 1000
    logLevel: 'disabled'      # trace, debug, info, warn, error
    symbols:
      - 'MAIN.MYBOOL'
      - 'MAIN.MYTRIGGER:0:10' # name:maxDelayMs:cycleTimeMs
      - '.superDuperInt'

pipeline:
  processors:
    - mapping: |
        root = {
          meta("symbol_name"): this,
          "data_type": meta("data_type"),
          "timestamp_ms": (timestamp_unix_nano() / 1000000).floor()
        }

output:
  stdout: {}

logger:
  level: INFO
  format: logfmt
  add_timestamp: true
